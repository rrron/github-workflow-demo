name: jira-comment

on:
  pull_request:
    types: [opened, reopened, closed]

permissions:
  contents: read

jobs:
  comment:
    name: jira-comment
    runs-on: ubuntu-latest
    if: vars.JIRA_ENABLED == 'true'
    steps:
      - name: Send pull request comment to Jira
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/[A-Z][A-Z0-9]+-\d+/);

            if (!match) {
              core.info("No Jira key found in PR title.");
              return;
            }

            const issueKey = match[0];
            const state = context.payload.pull_request.merged
              ? "merged"
              : context.payload.pull_request.state;
            const body = {
              body: {
                type: "doc",
                version: 1,
                content: [
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: `GitHub PR ${context.payload.pull_request.html_url} is ${state}.`,
                      },
                    ],
                  },
                ],
              },
            };

            const auth = Buffer
              .from(`${process.env.JIRA_EMAIL}:${process.env.JIRA_API_TOKEN}`)
              .toString("base64");

            const response = await fetch(
              `${process.env.JIRA_BASE_URL}/rest/api/3/issue/${issueKey}/comment`,
              {
                method: "POST",
                headers: {
                  "Authorization": `Basic ${auth}`,
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(body),
              },
            );

            if (!response.ok) {
              const text = await response.text();
              core.setFailed(`Jira comment failed: ${response.status} ${text}`);
            }
