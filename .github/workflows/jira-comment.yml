name: jira-comment

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  comment:
    name: jira-comment
    runs-on: ubuntu-latest
    environment: github-workflow-demo
    steps:
      - name: Send pull request comment to Jira
        uses: actions/github-script@v7
        env:
          JIRA_ENABLED: ${{ vars.JIRA_ENABLED }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          script: |
            if (process.env.JIRA_ENABLED !== "true") {
              core.info("Jira comments are disabled because JIRA_ENABLED is not true.");
              return;
            }

            const pullRequest = context.payload.pull_request;

            if (!pullRequest) {
              core.info("No pull request found for this event.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const clientByRepo = {
              "client-robyn-workflow-demo": "Robyn",
              "client-amber-workflow-demo": "Amber",
            };
            const repoByClient = {
              Robyn: "rrron/client-robyn-workflow-demo",
              Amber: "rrron/client-amber-workflow-demo",
            };
            const scrumTicketPattern = /\bSCRUM-\d+\b/i;
            const clientPattern = /\[(Robyn|Amber)\]/i;
            const clientNamePattern = /\b(robyn|amber)\b/i;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const issueMatch = [
              pullRequest.title,
              pullRequest.head.ref,
              pullRequest.body || "",
              ...commits.map((commit) => commit.commit.message),
            ]
              .map((value) => value.match(scrumTicketPattern))
              .find(Boolean);

            if (!issueMatch) {
              core.info("No SCRUM ticket found in PR title, branch, description, or commits.");
              return;
            }

            const issueKey = issueMatch[0].toUpperCase();
            const titleClientMatch = [pullRequest.title, pullRequest.body || ""]
              .map((value) => value.match(clientPattern))
              .find(Boolean);
            const branchClientMatch = pullRequest.head.ref.match(clientNamePattern);
            const branchClient = branchClientMatch
              ? branchClientMatch[1][0].toUpperCase() + branchClientMatch[1].slice(1).toLowerCase()
              : null;
            const client =
              clientByRepo[pullRequest.head.repo?.name] ||
              (titleClientMatch ? titleClientMatch[1][0].toUpperCase() + titleClientMatch[1].slice(1).toLowerCase() : null) ||
              branchClient ||
              "Common";
            const prUrl = pullRequest.html_url;
            const prLinkText = `#${pullRequest.number}`;
            const actor = context.actor;
            const sourceRepo = repoByClient[client] || pullRequest.head.repo?.full_name || pullRequest.head.label;
            const targetRepo = pullRequest.base.repo.full_name;
            const branch = pullRequest.head.ref;
            const base = pullRequest.base.ref;
            const eventName = context.eventName;
            const action = context.payload.action;
            const reviewState = context.payload.review?.state;
            const commitSummary = commits
              .slice(0, 10)
              .map((commit) => `${commit.sha.slice(0, 7)} ${commit.commit.message.split("\n")[0]}`)
              .join("; ");

            const text = (value) => ({ type: "text", text: value });
            const link = (value, href) => ({
              type: "text",
              text: value,
              marks: [{ type: "link", attrs: { href } }],
            });

            let comment = null;

            if (eventName === "pull_request_review" && reviewState === "approved") {
              comment = [
                text(`GitHub PR approved for ${client} by ${actor}: `),
                link(prLinkText, prUrl),
                text(`. Jira: ${issueKey}. Source: ${sourceRepo} / ${branch}. Commits: ${commitSummary || "none"}.`),
              ];
            } else if (eventName === "pull_request_target" && action === "closed" && pullRequest.merged) {
              const shortSha = pullRequest.merge_commit_sha?.substring(0, 7) || pullRequest.head.sha.substring(0, 7);
              const commitUrl = `https://github.com/${targetRepo}/commit/${pullRequest.merge_commit_sha || pullRequest.head.sha}`;
              comment = [
                text(`GitHub PR merged for ${client} to ${targetRepo} / ${base}: `),
                link(prLinkText, prUrl),
                text(". Final commit: "),
                link(shortSha, commitUrl),
                text(`. Jira: ${issueKey}. Commits: ${commitSummary || "none"}.`),
              ];
            } else if (eventName === "pull_request_target" && action === "closed") {
              comment = [
                text(`GitHub PR closed without merge for ${client} by ${actor}: `),
                link(prLinkText, prUrl),
                text(`. Jira: ${issueKey}.`),
              ];
            } else if (eventName === "pull_request_target" && ["opened", "reopened", "synchronize"].includes(action)) {
              comment = [
                text(`GitHub PR ${action} for ${client} by ${actor}: `),
                link(prLinkText, prUrl),
                text(`. Jira: ${issueKey}. Source: ${sourceRepo} / ${branch}; target: ${targetRepo} / ${base}. Commits: ${commitSummary || "none"}.`),
              ];
            }

            if (!comment) {
              core.info(`No Jira comment configured for ${eventName}/${action || reviewState}.`);
              return;
            }

            const body = {
              body: {
                type: "doc",
                version: 1,
                content: [
                  {
                    type: "paragraph",
                    content: comment,
                  },
                ],
              },
            };

            const auth = Buffer
              .from(`${process.env.JIRA_EMAIL}:${process.env.JIRA_API_TOKEN}`)
              .toString("base64");

            const response = await fetch(
              `${process.env.JIRA_BASE_URL}/rest/api/3/issue/${issueKey}/comment`,
              {
                method: "POST",
                headers: {
                  "Authorization": `Basic ${auth}`,
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(body),
              },
            );

            if (!response.ok) {
              const text = await response.text();
              core.setFailed(`Jira comment failed: ${response.status} ${text}`);
            }
