name: jira-comment

on:
  pull_request:
    types: [opened, reopened, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  comment:
    name: jira-comment
    runs-on: ubuntu-latest
    environment: github-workflow-demo
    steps:
      - name: Send pull request comment to Jira
        uses: actions/github-script@v7
        env:
          JIRA_ENABLED: ${{ vars.JIRA_ENABLED }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          script: |
            if (process.env.JIRA_ENABLED !== "true") {
              core.info("Jira comments are disabled because JIRA_ENABLED is not true.");
              return;
            }

            const pullRequest = context.payload.pull_request;
            const title = pullRequest.title;
            const match = title.match(/[A-Z][A-Z0-9]+-\d+/);

            if (!match) {
              core.info("No Jira key found in PR title.");
              return;
            }

            const issueKey = match[0];
            const prUrl = pullRequest.html_url;
            const actor = context.actor;
            const shortSha = pullRequest.head.sha.substring(0, 7);
            const branch = pullRequest.head.ref;
            const base = pullRequest.base.ref;
            const eventName = context.eventName;
            const action = context.payload.action;
            const reviewState = context.payload.review?.state;

            let message = null;

            if (eventName === "pull_request_review" && reviewState === "approved") {
              message = `GitHub PR approved by ${actor}: ${prUrl}. Auto-merge can complete after required gates pass.`;
            } else if (eventName === "pull_request" && action === "closed" && pullRequest.merged) {
              message = `GitHub PR merged to ${base}: ${prUrl}. Final commit: ${shortSha}.`;
            } else if (eventName === "pull_request" && action === "closed") {
              message = `GitHub PR closed without merge by ${actor}: ${prUrl}.`;
            } else if (eventName === "pull_request" && ["opened", "reopened"].includes(action)) {
              message = `GitHub PR ${action} by ${actor}: ${prUrl}. Branch ${branch} targets ${base}; commit ${shortSha}.`;
            }

            if (!message) {
              core.info(`No Jira comment configured for ${eventName}/${action || reviewState}.`);
              return;
            }

            const body = {
              body: {
                type: "doc",
                version: 1,
                content: [
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: message,
                      },
                    ],
                  },
                ],
              },
            };

            const auth = Buffer
              .from(`${process.env.JIRA_EMAIL}:${process.env.JIRA_API_TOKEN}`)
              .toString("base64");

            const response = await fetch(
              `${process.env.JIRA_BASE_URL}/rest/api/3/issue/${issueKey}/comment`,
              {
                method: "POST",
                headers: {
                  "Authorization": `Basic ${auth}`,
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(body),
              },
            );

            if (!response.ok) {
              const text = await response.text();
              core.setFailed(`Jira comment failed: ${response.status} ${text}`);
            }
