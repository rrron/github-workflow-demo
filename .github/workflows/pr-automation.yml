name: pr-automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - name: Normalize client pull request metadata
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (!pr) {
              core.info("No pull request found for this event.");
              return;
            }

            const clientByRepo = {
              "client-robyn-workflow-demo": "Robyn",
              "client-amber-workflow-demo": "Amber",
            };
            const scrumTicketPattern = /\bSCRUM-(\d+)\b/i;
            const clientPattern = /\[(Robyn|Amber)\]/i;

            function detectClient() {
              const repoName = pr.head.repo?.name || "";
              const repoClient = clientByRepo[repoName];

              if (repoClient) {
                return repoClient;
              }

              const match = [pr.title, pr.body || ""]
                .map((value) => value.match(clientPattern))
                .find(Boolean);

              return match ? match[1][0].toUpperCase() + match[1].slice(1).toLowerCase() : null;
            }

            function detectScrumTicket(commits) {
              const sources = [
                pr.title,
                pr.head.ref,
                pr.body || "",
                ...commits.map((commit) => commit.commit.message),
              ];
              const match = sources
                .map((value) => value.match(scrumTicketPattern))
                .find(Boolean);

              return match ? `SCRUM-${match[1]}` : null;
            }

            function titleFromBranch(ticket, client) {
              const branchTail = pr.head.ref.split("/").at(-1) || pr.head.ref;
              let words = branchTail;

              if (ticket) {
                words = words.replace(new RegExp(ticket, "i"), "");
              }
              if (client) {
                words = words.replace(new RegExp(client, "i"), "");
              }

              words = words
                .replace(/[_-]+/g, " ")
                .replace(/\b(feature|bugfix|hotfix|demo|change)\b/gi, " ")
                .replace(/\s+/g, " ")
                .trim();

              return words || "Update client workflow";
            }

            function normalizeSummary(title, ticket, client) {
              let summary = title
                .replace(clientPattern, "")
                .replace(scrumTicketPattern, "")
                .trim();

              if (ticket) {
                const scrumNumber = ticket.split("-")[1];
                const githubGeneratedTitlePattern = new RegExp(
                  `^scrum\\s+${scrumNumber}(?:[\\s/_-]+)?`,
                  "i",
                );
                summary = summary
                  .replace(githubGeneratedTitlePattern, "")
                  .replace(/^[\s/_-]+/, "")
                  .trim();
              }

              if (client) {
                summary = summary
                  .replace(new RegExp(`^${client}\\b[\\s:_-]*`, "i"), "")
                  .trim();
              }

              return summary || titleFromBranch(ticket, client);
            }

            function buildTitle(ticket, client, summary) {
              const clientPrefix = client ? `[${client}] ` : "";
              const ticketPrefix = ticket ? `${ticket} ` : "";

              return `${clientPrefix}${ticketPrefix}${summary}`.replace(/\s+/g, " ").trim();
            }

            function buildCommitBullets(commits) {
              return commits
                .slice(0, 10)
                .map((commit) => {
                  const sha = commit.sha.slice(0, 7);
                  const message = commit.commit.message.split("\n")[0];
                  return `- [${sha}](${commit.html_url}) ${message}`;
                })
                .join("\n");
            }

            function upsertManagedSection(body, section) {
              const start = "<!-- demo-client-context:start -->";
              const end = "<!-- demo-client-context:end -->";
              const managed = `${start}\n${section.trim()}\n${end}`;

              if (!body) {
                return `${managed}\n`;
              }

              const pattern = new RegExp(`${start}[\\s\\S]*?${end}`, "m");

              if (pattern.test(body)) {
                return body.replace(pattern, managed);
              }

              return `${managed}\n\n${body.trim()}\n`;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const client = detectClient();
            const ticket = detectScrumTicket(commits);
            const summary = normalizeSummary(pr.title, ticket, client);
            const title = buildTitle(ticket, client, summary);
            const commitBullets = buildCommitBullets(commits) || "- No commits found.";
            const clientName = client || "Common";
            const jiraKey = ticket || "SCRUM-000";
            const sourceRepo = pr.head.repo?.full_name || pr.head.label;
            const section = [
              "## Client",
              "",
              clientName,
              "",
              "## Jira",
              "",
              jiraKey,
              "",
              "## Source",
              "",
              `Repository: ${sourceRepo}`,
              `Branch: ${pr.head.ref}`,
              `Target: ${pr.base.repo.full_name} / ${pr.base.ref}`,
              "",
              "## Change Summary",
              "",
              commitBullets,
              "",
              "## Demo Review Policy",
              "",
              "Required approvals: 6",
              "",
              "Required reviewers:",
              `- ${clientName} Product Owner`,
              `- ${clientName} Security`,
              `- ${clientName} QA`,
              "- Common Platform",
              "- Release Manager",
              "- Jira Owner",
            ].join("\n");
            const body = upsertManagedSection(pr.body || "", section);

            if (pr.title !== title || (pr.body || "") !== body) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              core.info(`Updated pull request metadata for ${clientName}: "${title}".`);
            } else {
              core.info("Pull request metadata is already up to date.");
            }

  client-review-policy:
    name: client-review-policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - name: Publish demo reviewer policy
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const clientByRepo = {
              "client-robyn-workflow-demo": "Robyn",
              "client-amber-workflow-demo": "Amber",
            };
            const client = clientByRepo[pr.head.repo?.name] || "Common";
            const reviewers = [
              `${client} Product Owner`,
              `${client} Security`,
              `${client} QA`,
              "Common Platform",
              "Release Manager",
              "Jira Owner",
            ];

            await core.summary
              .addHeading("Client review policy")
              .addRaw(`Client: ${client}`)
              .addBreak()
              .addRaw("Required approvals: 6")
              .addBreak()
              .addList(reviewers)
              .write();

  labels:
    name: labels
    runs-on: ubuntu-latest
    steps:
      - name: Update status labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (!pr) {
              core.info("No pull request found for this event.");
              return;
            }
            if (pr.state && pr.state !== "open") {
              core.info(`Pull request is ${pr.state}; status labels will not be changed.`);
              return;
            }

            const currentLabels = pr.labels || [];
            const labelNames = currentLabels.map((label) => label.name);
            const statusLabels = [
              "status: needs-review",
              "status: changes-requested",
              "status: approved",
            ];

            async function removeStatusLabelsExcept(keep) {
              for (const label of statusLabels) {
                if (label !== keep && labelNames.includes(label)) {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: label,
                  }).catch(() => {});
                }
              }
            }

            async function addLabel(name) {
              if (!labelNames.includes(name)) {
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pr.number,
                    labels: [name],
                  });
                } catch (error) {
                  core.warning(`Could not add label ${name}: ${error.message}`);
                }
              }
            }

            if (context.eventName === "pull_request_review") {
              const state = context.payload.review.state;
              if (state === "changes_requested") {
                await removeStatusLabelsExcept("status: changes-requested");
                await addLabel("status: changes-requested");
              }
              if (state === "approved") {
                await removeStatusLabelsExcept("status: approved");
                await addLabel("status: approved");
              }
              return;
            }

            if (pr.draft || context.payload.action === "synchronize") {
              await removeStatusLabelsExcept("status: needs-review");
              await addLabel("status: needs-review");
              return;
            }

            if (!labelNames.some((label) => statusLabels.includes(label))) {
              await addLabel("status: needs-review");
            }
