name: pr-automation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    steps:
      - name: Prefix title with Jira key from branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (!pr) {
              core.info("No pull request found for this event.");
              return;
            }

            const jiraKeyPattern = /\b([A-Z][A-Z0-9]+-\d+)\b/i;
            const titleMatch = pr.title.match(jiraKeyPattern);

            if (titleMatch) {
              core.info(`Pull request title already contains Jira key ${titleMatch[1].toUpperCase()}.`);
              return;
            }

            const branchMatch = pr.head.ref.match(jiraKeyPattern);

            if (!branchMatch) {
              core.info(`No Jira key found in branch ${pr.head.ref}.`);
              return;
            }

            const jiraKey = branchMatch[1].toUpperCase();
            const title = `${jiraKey} ${pr.title}`.trim();

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              title,
            });

            core.info(`Updated pull request title to "${title}".`);

  labels:
    name: labels
    runs-on: ubuntu-latest
    steps:
      - name: Update status labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pr = context.payload.pull_request;

            if (!pr) {
              core.info("No pull request found for this event.");
              return;
            }
            if (pr.state && pr.state !== "open") {
              core.info(`Pull request is ${pr.state}; status labels will not be changed.`);
              return;
            }

            const currentLabels = context.payload.pull_request?.labels || [];
            const labelNames = currentLabels.map((label) => label.name);
            const statusLabels = [
              "status: needs-review",
              "status: changes-requested",
              "status: approved",
            ];

            async function removeStatusLabelsExcept(keep) {
              for (const label of statusLabels) {
                if (label !== keep && labelNames.includes(label)) {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: label,
                  }).catch(() => {});
                }
              }
            }

            async function addLabel(name) {
              if (!labelNames.includes(name)) {
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pr.number,
                    labels: [name],
                  });
                } catch (error) {
                  core.warning(`Could not add label ${name}: ${error.message}`);
                }
              }
            }

            if (context.eventName === "pull_request_review") {
              const state = context.payload.review.state;
              if (state === "changes_requested") {
                await removeStatusLabelsExcept("status: changes-requested");
                await addLabel("status: changes-requested");
              }
              if (state === "approved") {
                await removeStatusLabelsExcept("status: approved");
                await addLabel("status: approved");
              }
              return;
            }

            if (pr.draft || context.payload.action === "synchronize") {
              await removeStatusLabelsExcept("status: needs-review");
              await addLabel("status: needs-review");
              return;
            }

            if (!labelNames.some((label) => statusLabels.includes(label))) {
              await addLabel("status: needs-review");
            }
