name: pr-automation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labels:
    name: labels
    runs-on: ubuntu-latest
    if: github.event_name != 'issues' || github.event.issue.pull_request
    steps:
      - name: Update status labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pr = context.payload.pull_request
              || (context.payload.issue && {
                number: context.payload.issue.number,
                draft: false,
              });

            if (!pr) {
              core.info("No pull request found for this event.");
              return;
            }

            const currentLabels = context.payload.issue?.labels
              || context.payload.pull_request?.labels
              || [];
            const labelNames = currentLabels.map((label) => label.name);
            const statusLabels = [
              "status: needs-review",
              "status: changes-requested",
              "status: approved",
              "status: ready-to-merge",
            ];

            async function removeStatusLabelsExcept(keep) {
              for (const label of statusLabels) {
                if (label !== keep && labelNames.includes(label)) {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: label,
                  }).catch(() => {});
                }
              }
            }

            async function addLabel(name) {
              if (!labelNames.includes(name)) {
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pr.number,
                    labels: [name],
                  });
                } catch (error) {
                  core.warning(`Could not add label ${name}: ${error.message}`);
                }
              }
            }

            if (context.eventName === "pull_request_review") {
              const state = context.payload.review.state;
              if (state === "changes_requested") {
                await removeStatusLabelsExcept("status: changes-requested");
                await addLabel("status: changes-requested");
              }
              if (state === "approved" && !labelNames.includes("status: ready-to-merge")) {
                await removeStatusLabelsExcept("status: approved");
                await addLabel("status: approved");
              }
              return;
            }

            if (pr.draft) {
              await removeStatusLabelsExcept("status: needs-review");
              await addLabel("status: needs-review");
              return;
            }

            if (!labelNames.some((label) => statusLabels.includes(label))) {
              await addLabel("status: needs-review");
            }
